server {
    listen 80;
    server_name viaggio-firenze-2026.filippobilardo.it;

    # Corrisponde al virtual host Apache:
    # DocumentRoot /var/www/html/inf3myphp/prj/VI/viaggio-firenze-2026
    # Serve un bind mount coerente nel compose per pubblicare realmente i file.
    root /var/www/html/viaggio-firenze-2026;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_pass php:9000;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
